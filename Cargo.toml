[package]
name = "mime_reader"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "2"

# JS-binding dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
# Derives TypeScript definitions (and the JS-value ABI) from the DTO structs.
# Pulls in serde-wasm-bindgen transitively via its `js` feature.
tsify = { version = "0.5", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Native-only: criterion for benchmarks
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"

[[bench]]
name = "distance_vs_align"
harness = false
