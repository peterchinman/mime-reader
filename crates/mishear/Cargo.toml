[package]
name = "mishear"
version = "0.1.0"
edition = "2024"
description = "Fuzzy phonetic search, accent deformations and a mishearing engine, on mime-reader"
publish = false

[dependencies]
mime-reader = { path = "../.." }
rust-stemmers = "1"
rustc-hash = "2"

[lib]
crate-type = ["cdylib", "rlib"]

# The web app's bindings (src/wasm.rs), as in the library's own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5", features = ["js"] }
